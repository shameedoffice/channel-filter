<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>Channel Filter Camera</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;min-height:100vh}header{padding:14px 16px 8px;font-weight:700;font-size:18px}main{max-width:900px;margin:auto;padding:0 12px 24px}.stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}video{opacity:0;pointer-events:none}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{min-height:46px;border:1px solid #444;border-radius:10px;background:#222;color:#fff;font-size:15px;font-weight:650}button.active{outline:2px solid #fff;background:#444}button:disabled{opacity:.45}.row button{flex:1 1 150px}.status{margin-top:10px;padding:10px 12px;background:#1b1b1b;border-radius:10px;font-size:13px;line-height:1.4;color:#ccc}.note{margin-top:10px;font-size:12px;color:#aaa;line-height:1.45}@media(max-width:600px){.stage{aspect-ratio:4/3}button{min-height:44px}}</style></head><body><header>Channel Filter Camera</header><main><div class="stage"><video id="video" autoplay playsinline muted></video><canvas id="view"></canvas></div><div class="controls"><button data-mode="rgb" class="active">RGB</button><button data-mode="red">RED</button><button data-mode="green">GREEN</button><button data-mode="blue">BLUE</button></div><div class="row"><button id="start">Start camera</button><button id="save" disabled>Save filtered photo</button><button id="flip" disabled>Flip camera</button></div><div class="row"><button id="lockExp" disabled>Exposure: Auto</button><button id="lockWb" disabled>White balance: Auto</button></div><div id="status" class="status">Tap “Start camera” and allow camera access.</div><div class="note">For AVS HD 709 flashing color bars, use <b>BLUE</b>. This is a browser-based channel-isolation aid, not an instrument-grade colorimeter. Browser camera APIs cannot provide native Android RAW_SENSOR access.</div></main><script>(()=>{const v=document.getElementById('video'),c=document.getElementById('view'),x=c.getContext('2d',{willReadFrequently:true}),s=document.getElementById('status'),start=document.getElementById('start'),save=document.getElementById('save'),flip=document.getElementById('flip'),ex=document.getElementById('lockExp'),wb=document.getElementById('lockWb');let stream=null,track=null,mode='rgb',facing='environment',raf=0,el=false,wl=false;function msg(t){s.textContent=t}function stop(){cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;track=null}async function startCam(){stop();if(!navigator.mediaDevices?.getUserMedia){msg('Camera access is unavailable. Use Chrome on Android over HTTPS.');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false});v.srcObject=stream;await v.play();track=stream.getVideoTracks()[0];save.disabled=flip.disabled=ex.disabled=wb.disabled=false;resize();report();draw()}catch(e){msg('Camera could not start: '+(e.name||e.message)+'. Camera access normally requires HTTPS (or localhost).')}}function resize(){if(!v.videoWidth)return;const m=1280,q=Math.min(1,m/v.videoWidth);c.width=Math.max(1,Math.round(v.videoWidth*q));c.height=Math.max(1,Math.round(v.videoHeight*q))}function draw(){if(!stream||v.readyState<2){raf=requestAnimationFrame(draw);return}x.drawImage(v,0,0,c.width,c.height);if(mode!=='rgb'){const im=x.getImageData(0,0,c.width,c.height),p=im.data,k=mode==='red'?0:mode==='green'?1:2;for(let i=0;i<p.length;i+=4){const z=p[i+k];p[i]=p[i+1]=p[i+2]=z}x.putImageData(im,0,0)}raf=requestAnimationFrame(draw)}function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));msg(stream?'Camera running. Filter: '+m.toUpperCase():'Selected filter: '+m.toUpperCase())}function report(){const q=track?.getCapabilities?.()||{};const a=[];if(q.exposureMode)a.push('exposure control available');if(q.whiteBalanceMode)a.push('white-balance control available');if(!a.length)a.push('manual exposure/WB not exposed by this browser/device');msg('Camera running. Filter: '+mode.toUpperCase()+'. '+a.join('; ')+'.')}async function lockExposure(){const q=track?.getCapabilities?.()||{};if(!q.exposureMode?.includes('manual'))return msg('Manual exposure is not exposed by this browser/device.');el=!el;try{await track.applyConstraints({advanced:[{exposureMode:el?'manual':'continuous'}]});ex.textContent='Exposure: '+(el?'Locked':'Auto')}catch{el=!el;msg('Could not change exposure mode on this device.')}}async function lockWB(){const q=track?.getCapabilities?.()||{};if(!q.whiteBalanceMode?.includes('manual'))return msg('Manual white balance is not exposed by this browser/device.');wl=!wl;try{await track.applyConstraints({advanced:[{whiteBalanceMode:wl?'manual':'continuous'}]});wb.textContent='White balance: '+(wl?'Locked':'Auto')}catch{wl=!wl;msg('Could not change white-balance mode on this device.')}}start.onclick=startCam;flip.onclick=async()=>{facing=facing==='environment'?'user':'environment';await startCam()};save.onclick=()=>c.toBlob(b=>{if(!b)return;const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='channel-filter-'+mode+'-'+new Date().toISOString().replace(/[:.]/g,'-')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)},'image/png');ex.onclick=lockExposure;wb.onclick=lockWB;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));addEventListener('resize',resize)})();</script></body></html>
